<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N3NY000 has moved &middot; nenyoocheats.org</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://nenyoocheats.org/">
<meta http-equiv="refresh" content="0; url=https://nenyoocheats.org/">
<link rel="icon" type="image/png" href="brand/Logo.png">
<meta name="theme-color" content="#05040a">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#05040a;color:#e8e4f0;text-align:center;padding:32px;
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  .glow{position:fixed;top:-160px;left:50%;transform:translateX(-50%);width:min(720px,110%);height:420px;
    background:radial-gradient(circle,rgba(124,58,237,.34),transparent 65%);filter:blur(16px);pointer-events:none;}
  .box{position:relative;max-width:460px;}
  img{width:132px;height:auto;margin:0 auto 26px;display:block;filter:drop-shadow(0 0 22px rgba(168,85,247,.5));}
  h1{font-size:26px;letter-spacing:.02em;margin:0 0 14px;}
  p{font-size:15px;line-height:1.65;color:#a49ebb;margin:0 0 26px;}
  a.go{
    display:inline-block;padding:14px 30px;background:linear-gradient(120deg,#7c3aed,#a855f7);
    color:#fff;text-decoration:none;font-weight:700;letter-spacing:.03em;
  }
  a.go:hover{filter:brightness(1.12);}
  .mono{display:block;margin-top:22px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#6d6685;}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="box">
  <img src="brand/Logo@512.gif" alt="N3NY000" onerror="this.onerror=null;this.src='brand/Logo.png';">
  <h1>We&rsquo;ve moved</h1>
  <p>N3NY000 now lives at <strong>nenyoocheats.org</strong>. You&rsquo;ll be taken there automatically &mdash; if nothing happens, use the button.</p>
  <a class="go" href="https://nenyoocheats.org/">Go to nenyoocheats.org</a>
  <span class="mono">Redirecting&hellip;</span>
</div>
<script>
  /* keep the path so deep links land in the right place on the new site */
  var path = location.pathname.replace(/\/index\.html$/, '/');
  location.replace('https://nenyoocheats.org' + path + location.search + location.hash);
</script>
</body>
</html>
